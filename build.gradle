plugins {
	// Minecraft 1.21.11 is obfuscated: compiled against Mojang's names and remapped to intermediary
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
	id 'maven-publish'
}

repositories {
	// EXIT (emergency_exit) is not published anywhere yet: `./gradlew :fabric:publishToMavenLocal` in its repository (branch port/1.21.11).
	exclusiveContent {
		forRepository {
			mavenLocal()
		}
		filter {
			includeGroup "ml.mypals.exit"
		}
	}
	exclusiveContent {
		forRepository {
			maven {
				name = "Modrinth"
				url = "https://api.modrinth.com/maven"
			}
		}
		// forRepositories(fg.repository) // Uncomment when using ForgeGradle
		filter {
			includeGroup "maven.modrinth"
		}
	}
	exclusiveContent {
		forRepository {
			maven {
				name = "FallenBreath"
				url = "https://maven.fallenbreath.me/releases"
			}
		}
		filter {
			includeGroup "me.fallenbreath"
		}
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"


	modImplementation "maven.modrinth:bEpr0Arc:mengBR9D" // Litematica 0.26.16
	modImplementation "maven.modrinth:malilib:loabWpyU" // MaLiLib 0.27.20
	// Litematica and MaLiLib nest it, but the development runtime does not load nested jars of dependencies.
	modLocalRuntime "me.fallenbreath:conditional-mixin-fabric:0.6.4"

	// EXIT routes the schematic rendering past shader packs. Nested, so players do not install it separately.
	modImplementation("ml.mypals.exit:emergency_exit-fabric:${project.exit_version}") { transitive = false }
	include("ml.mypals.exit:emergency_exit-fabric:${project.exit_version}")

	// Iris and Sodium for the development runs only, the same versions EXIT is built against.
	modCompileOnly "maven.modrinth:YL57xq9U:${project.iris_version}"
	modLocalRuntime "maven.modrinth:YL57xq9U:${project.iris_version}"
	modLocalRuntime "maven.modrinth:AANobbMI:${project.sodium_version}"
	// Iris nests these in its jar, but the development runtime does not load nested jars of dependencies.
	for (library in ["org.anarres:jcpp:1.4.14", "org.antlr:antlr4-runtime:4.13.1", "io.github.douira:glsl-transformer:3.0.0-pre3"]) {
		localRuntime(library) { transitive = false }
	}
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
